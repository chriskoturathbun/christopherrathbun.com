<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Party Plus One — throw a party, text the invites</title>
  <meta name="description" content="Create an event, invite people by text or email, and watch RSVPs roll in. No apps, no data harvesting." />
  <link rel="icon" type="image/svg+xml" href="/landing/mark.svg" />
  <link rel="stylesheet" href="/parties/parties.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:ital,wght@0,600;1,600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <script
    async crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsuY2hyaXN0b3BoZXJyYXRoYnVuLmNvbSQ"
    src="https://clerk.christopherrathbun.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
  <style>
    .app-main { max-width: 980px; margin: 0 auto; padding: 4vh 20px 10vh; }
    .brand { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
    .brand strong { font-size: 18px; letter-spacing: -0.01em; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }

    .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 18px; }
    .event-tile { padding: 22px; cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
    .event-tile:hover { transform: translateY(-3px); border-color: var(--accent); }
    .event-tile .em { font-size: 34px; }
    .event-tile h3 { margin: 8px 0 4px; font-size: 19px; letter-spacing: -0.01em; }
    .event-tile .meta { font-size: 14px; color: var(--muted); }
    .event-tile .counts { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .new-tile { display: flex; align-items: center; justify-content: center; min-height: 150px;
      border-style: dashed; font-size: 16px; color: var(--muted); }
    .new-tile:hover { color: var(--text); }

    .form-card { padding: 28px clamp(20px, 4vw, 34px); max-width: 640px; margin: 0 auto; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .row-2 { grid-template-columns: 1fr; } }
    .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .emoji-opt { font-size: 22px; padding: 8px 12px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
    .emoji-opt.sel { border-color: var(--accent); background: rgba(199,125,255,0.18); }

    .detail-head { padding: 26px clamp(20px, 4vw, 32px); margin-bottom: 18px; }
    .detail-head .em { font-size: 40px; }
    .detail-head h2 { margin: 6px 0 2px; }
    .detail-head .meta { color: var(--muted); font-size: 15px; }
    .stat-row { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 16px; }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat .lab { font-size: 13px; color: var(--muted); }
    .head-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

    .sec-card { padding: 24px clamp(18px, 4vw, 30px); margin-bottom: 18px; }
    .sec-card h3 { margin: 0 0 14px; font-size: 17px; }
    .guest-table { width: 100%; border-collapse: collapse; }
    .guest-table th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; }
    .guest-table td { font-size: 14px; padding: 9px 8px; border-top: 1px solid rgba(255,255,255,0.07); vertical-align: middle; }
    .guest-table .contact { color: var(--muted); font-size: 13px; }
    .g-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; }
    .g-del:hover { color: var(--bad); }
    .table-scroll { overflow-x: auto; }
    .send-log { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .progress { font-size: 14px; color: var(--accent); margin-top: 10px; }
    .copy-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer; color: var(--text); font-family: var(--font); }
    .copy-chip:hover { border-color: var(--accent); }
    .back-link { color: var(--muted); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 14px; cursor: pointer; }
    .back-link:hover { color: var(--text); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* Side-function chips (+ Link, + Playlist, …) */
    .fn-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
    .fn-chip { font-size: 13px; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); font-family: var(--font); }
    .fn-chip:hover { border-color: var(--accent); }
    .fn-chip.on { border-color: var(--accent); background: rgba(199,125,255,0.18); }
    .fn-field { display: none; }
    .fn-field.open { display: block; }

    /* Title font styles */
    .font-chip { font-size: 15px; padding: 7px 16px; border-radius: 999px; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
    .font-chip.sel { border-color: var(--accent); background: rgba(199,125,255,0.18); }
    .tf-classic { font-family: var(--font); }
    .tf-eclectic { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .tf-fancy { font-family: 'Dancing Script', cursive; font-size: 18px; }
    .tf-literary { font-family: 'Fraunces', Georgia, serif; font-style: italic; }

    /* Example cover gallery */
    .cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 6px; }
    .cover-thumb { position: relative; border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; aspect-ratio: 3/2; }
    .cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-thumb.sel { border-color: var(--accent); }
    .cover-thumb.none { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted);
      background: rgba(255,255,255,0.05); border: 2px dashed var(--border); }
    .cover-thumb.none.sel { border-color: var(--accent); color: var(--text); }

    /* Full emoji library modal */
    .emoji-modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }
    .emoji-panel { width: min(520px, calc(100vw - 32px)); max-height: min(72vh, 640px); display: flex; flex-direction: column;
      padding: 16px; border-radius: 18px; }
    .emoji-panel input { margin-bottom: 10px; }
    .emoji-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; }
    .emoji-tab { font-size: 18px; padding: 6px 10px; border-radius: 10px; cursor: pointer; background: none; border: 1px solid transparent; flex: 0 0 auto; }
    .emoji-tab.sel { border-color: var(--accent); background: rgba(199,125,255,0.18); }
    .emoji-grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; }
    .emoji-cell { font-size: 24px; padding: 7px 0; text-align: center; cursor: pointer; border-radius: 8px; }
    .emoji-cell:hover { background: rgba(255,255,255,0.1); }

    /* Date poll */
    .poll-opt { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 14px; flex-wrap: wrap; }
    .poll-bar { height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.7; min-width: 4px; }
  </style>
</head>
<body>
  <div class="fluid-bg"></div>
  <header class="wrap brand">
    <strong>🎈 Party Plus One</strong>
    <span id="brand-right"></span>
  </header>
  <main class="app-main" id="root">
    <div class="center-wrap"><p class="muted">Loading…</p></div>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';
    var root = document.getElementById('root');
    var EMOJIS = ['🎉','🎂','🍻','🏠','🌮','🎃','🎄','💃','🏖️','🎾','🍷','🔥'];

    /* ---- Full emoji library (loaded lazily from /parties/emoji.json) ---- */
    var emojiData = null;
    var GROUP_ICONS = { 'Smileys & Emotion': '😀', 'People & Body': '🧑', 'Animals & Nature': '🐻', 'Food & Drink': '🍔',
      'Travel & Places': '✈️', 'Activities': '⚽', 'Objects': '💡', 'Symbols': '❤️', 'Flags': '🏁' };

    function openEmojiPicker(onPick) {
      var overlay = document.createElement('div');
      overlay.className = 'emoji-modal';
      overlay.innerHTML = '<div class="emoji-panel glass">' +
        '<input type="text" id="emoji-search" placeholder="Search emoji…" autocomplete="off">' +
        '<div class="emoji-tabs" id="emoji-tabs"></div>' +
        '<div class="emoji-grid" id="emoji-grid"><span class="muted" style="grid-column:1/-1;padding:20px;text-align:center">Loading the library…</span></div>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      function close() { document.body.removeChild(overlay); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);

      var grid = overlay.querySelector('#emoji-grid');
      var tabs = overlay.querySelector('#emoji-tabs');
      var search = overlay.querySelector('#emoji-search');
      var curGroup = 0;

      function cells(list) {
        grid.innerHTML = list.length
          ? list.map(function (x) { return '<span class="emoji-cell" title="' + esc(x.n) + '" data-e="' + x.e + '">' + x.e + '</span>'; }).join('')
          : '<span class="muted" style="grid-column:1/-1;padding:20px;text-align:center">No matches.</span>';
        Array.prototype.forEach.call(grid.querySelectorAll('.emoji-cell'), function (el) {
          el.addEventListener('click', function () { onPick(el.getAttribute('data-e')); close(); });
        });
      }
      function showGroup(i) {
        curGroup = i;
        Array.prototype.forEach.call(tabs.children, function (t, j) { t.classList.toggle('sel', j === i); });
        cells(emojiData.groups[i].emoji);
      }
      function ready() {
        tabs.innerHTML = emojiData.groups.map(function (gr, i) {
          return '<button type="button" class="emoji-tab" title="' + esc(gr.name) + '">' + (GROUP_ICONS[gr.name] || '✨') + '</button>';
        }).join('');
        Array.prototype.forEach.call(tabs.children, function (t, i) {
          t.addEventListener('click', function () { search.value = ''; showGroup(i); });
        });
        showGroup(0);
        search.addEventListener('input', function () {
          var q = search.value.trim().toLowerCase();
          if (!q) { showGroup(curGroup); return; }
          var out = [];
          for (var i = 0; i < emojiData.groups.length && out.length < 300; i++) {
            var g = emojiData.groups[i].emoji;
            for (var j = 0; j < g.length && out.length < 300; j++) {
              if (g[j].n.indexOf(q) !== -1) out.push(g[j]);
            }
          }
          cells(out);
        });
        search.focus();
      }
      if (emojiData) { ready(); }
      else {
        fetch('/parties/emoji.json').then(function (r) { return r.json(); }).then(function (d) { emojiData = d; ready(); })
          .catch(function () { grid.innerHTML = '<span class="muted" style="grid-column:1/-1;padding:20px;text-align:center">Could not load the emoji library.</span>'; });
      }
    }

    /* ---- Example covers, title fonts, side-function chips ---- */
    var COVERS = ['confetti-pop','disco-night','golden-hour','neon-glow','ocean-splash','garden-party','birthday-cake','cocktail-hour',
      'movie-night','game-night','picnic-day','beach-bash','winter-lights','retro-wave','midnight-stars','sunset-soiree'];
    function coverUrl(name) { return location.origin + '/parties/covers/' + name + '.svg'; }

    function coverGridHtml(currentUrl) {
      var isCustom = currentUrl && COVERS.every(function (c) { return coverUrl(c) !== currentUrl; });
      return '<div class="cover-grid">' +
        '<div class="cover-thumb none' + (currentUrl ? '' : ' sel') + '" data-cover="">None</div>' +
        COVERS.map(function (c) {
          return '<div class="cover-thumb' + (currentUrl === coverUrl(c) ? ' sel' : '') + '" data-cover="' + coverUrl(c) + '" title="' + c.replace(/-/g, ' ') + '">' +
            '<img src="/parties/covers/' + c + '.svg" alt="' + c.replace(/-/g, ' ') + '" loading="lazy"></div>';
        }).join('') +
        '</div>' +
        '<div class="hint">…or paste your own image URL below' + (isCustom ? ' (using a custom image now)' : '') + '.</div>';
    }
    function bindCoverGrid(inputEl) {
      Array.prototype.forEach.call(document.querySelectorAll('.cover-thumb'), function (el) {
        el.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('.cover-thumb'), function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          inputEl.value = el.getAttribute('data-cover');
        });
      });
      inputEl.addEventListener('input', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.cover-thumb'), function (x) {
          x.classList.toggle('sel', x.getAttribute('data-cover') === inputEl.value.trim());
        });
      });
    }

    var TITLE_FONTS = [
      { k: 'classic', label: 'Classic' },
      { k: 'eclectic', label: 'Eclectic' },
      { k: 'fancy', label: 'Fancy' },
      { k: 'literary', label: 'Literary' },
    ];
    function fontChipRow(sel) {
      return '<div class="emoji-row" id="font-row">' + TITLE_FONTS.map(function (f) {
        return '<button type="button" class="font-chip tf-' + f.k + (f.k === sel ? ' sel' : '') + '" data-f="' + f.k + '">' + f.label + '</button>';
      }).join('') + '</div>';
    }
    function bindFontRow(titleInput) {
      Array.prototype.forEach.call(document.querySelectorAll('.font-chip'), function (el) {
        el.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('.font-chip'), function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          if (titleInput) titleInput.className = 'tf-' + el.getAttribute('data-f');
        });
      });
    }
    function selectedFont() {
      var el = document.querySelector('.font-chip.sel');
      return el ? el.getAttribute('data-f') : 'classic';
    }

    function bindFnChips() {
      Array.prototype.forEach.call(document.querySelectorAll('.fn-chip[data-fn]'), function (el) {
        el.addEventListener('click', function () {
          var f = document.getElementById(el.getAttribute('data-fn'));
          var open = f.classList.toggle('open');
          el.classList.toggle('on', open);
          if (open) { var inp = f.querySelector('input,textarea'); if (inp) inp.focus(); }
        });
      });
    }
    // A chip-revealed field only submits its value while open (chip toggled on).
    function fnValue(fieldId, inputId) {
      var f = document.getElementById(fieldId);
      if (!f || !f.classList.contains('open')) return '';
      var inp = document.getElementById(inputId);
      return inp ? inp.value.trim() : '';
    }

    // Downscale an image file client-side (max 1600px, JPEG) so uploads stay
    // small; PNGs with transparency survive as-is when already small.
    function shrinkImage(file) {
      return new Promise(function (resolve, reject) {
        if (file.size < 400 * 1024) { resolve(file); return; }
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          var max = 1600, w = img.width, h = img.height;
          if (w > max || h > max) { var s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          c.toBlob(function (b) { b ? resolve(b) : reject(new Error('encode failed')); }, 'image/jpeg', 0.85);
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('not an image')); };
        img.src = url;
      });
    }

    async function uploadCover(eventId, file) {
      var blob = await shrinkImage(file);
      var res = await authFetch('/parties/api/events/' + eventId + '/cover', {
        method: 'POST',
        headers: { 'content-type': blob.type || 'image/jpeg' },
        body: blob,
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'upload failed');
      return data.cover_image_url;
    }

    // ISO string → value for a datetime-local input (browser-local wall clock).
    function localDatetimeValue(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    /* ---- Date poll editor (shared by create + detail) ---- */
    var dateOpts = [];
    function dateOptsHtml() {
      return '<div id="date-opts">' + dateOpts.map(function (iso, i) {
        return '<div class="poll-opt"><span>' + esc(new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '</span>' +
          '<button type="button" class="g-del" data-dopt="' + i + '" title="Remove option">✕</button></div>';
      }).join('') + '</div>';
    }
    function bindDateOpts(rerender) {
      Array.prototype.forEach.call(document.querySelectorAll('[data-dopt]'), function (el) {
        el.addEventListener('click', function () {
          dateOpts.splice(parseInt(el.getAttribute('data-dopt'), 10), 1);
          rerender();
        });
      });
    }
    // Bind once — the add button lives outside the rerendered list.
    function bindAddDateOpt(rerender) {
      var addBtn = document.getElementById('add-dopt');
      if (addBtn) addBtn.addEventListener('click', function () {
        var v = document.getElementById('dopt-input').value;
        if (!v) { toast('Pick a date and time first.'); return; }
        if (dateOpts.length >= 8) { toast('Up to 8 date options.'); return; }
        var iso = new Date(v).toISOString();
        if (dateOpts.indexOf(iso) === -1) dateOpts.push(iso);
        rerender();
      });
    }
    var state = { events: [], detail: null, sending: false };

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    /* ---- Clerk bootstrap (same pattern as /reminders/dashboard) ---- */
    function whenClerkReady() {
      return new Promise(function (resolve) {
        if (window.Clerk) { resolve(window.Clerk); return; }
        var tries = 0;
        var iv = setInterval(function () {
          tries++;
          if (window.Clerk) { clearInterval(iv); resolve(window.Clerk); }
          else if (tries > 200) { clearInterval(iv); resolve(null); }
        }, 100);
      });
    }

    async function boot() {
      var Clerk = await whenClerkReady();
      if (!Clerk) { renderMsg("Couldn't load the sign-in service. Please refresh the page."); return; }
      try { await Clerk.load(); } catch (e) { renderMsg('Sign-in failed to initialize. Please refresh and try again.'); return; }
      if (!Clerk.user) { renderSignIn(Clerk); return; }
      window._clerk = Clerk;
      document.getElementById('brand-right').innerHTML = '<button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>';
      document.getElementById('signout-btn').addEventListener('click', function () { Clerk.signOut().then(function () { location.reload(); }); });
      loadEvents();
    }

    function renderMsg(msg) {
      root.innerHTML = '<div class="center-wrap"><div class="glass msg-card"><p class="muted">' + esc(msg) + '</p></div></div>';
    }

    function renderSignIn(Clerk) {
      root.innerHTML =
        '<div class="center-wrap"><div class="glass signin-card">' +
          '<div style="font-size:44px;margin-bottom:8px">🎈</div>' +
          '<h2>Throw a party</h2>' +
          '<p class="muted">Create an event, text the invites, watch RSVPs roll in. Your guests never need an account — and nobody\'s data gets harvested.</p>' +
          '<button class="btn" id="signin-btn">Sign in to get started</button>' +
        '</div></div>';
      document.getElementById('signin-btn').addEventListener('click', function () {
        Clerk.openSignIn({ afterSignInUrl: '/parties', afterSignUpUrl: '/parties' });
      });
    }

    async function authFetch(url, opts) {
      var token = await window._clerk.session.getToken();
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['authorization'] = 'Bearer ' + token;
      if (opts.body && !opts.headers['content-type']) opts.headers['content-type'] = 'application/json';
      return fetch(url, opts);
    }

    /* ---- Events list ---- */
    async function loadEvents() {
      var res, data;
      try { res = await authFetch('/parties/api/events'); data = await res.json(); }
      catch (e) { renderMsg('Network error — please refresh.'); return; }
      if (res.status === 401) { renderSignIn(window._clerk); return; }
      if (!data.ok) { renderMsg('Something went wrong loading your events.'); return; }
      state.events = data.events;
      renderList();
    }

    function renderList() {
      var tiles = state.events.map(function (ev) {
        return '<div class="glass event-tile" data-id="' + esc(ev.id) + '">' +
          '<span class="em">' + esc(ev.emoji || '🎉') + '</span>' +
          '<h3>' + esc(ev.title) + '</h3>' +
          '<div class="meta">' + esc(ev.when_text || 'Date TBD') + (ev.status === 'cancelled' ? ' · cancelled' : '') + '</div>' +
          '<div class="counts">' +
            '<span class="pill yes"><span class="dot"></span>' + (ev.yes_count + (ev.plus_ones || 0)) + ' going</span>' +
            '<span class="pill pending"><span class="dot"></span>' + ev.guest_count + ' invited</span>' +
          '</div></div>';
      }).join('');
      root.innerHTML =
        '<div class="topbar"><h1 style="margin:0">Your events</h1></div>' +
        '<div class="event-grid">' + tiles +
          '<div class="glass event-tile new-tile" id="new-tile">+ New event</div>' +
        '</div>';
      document.getElementById('new-tile').addEventListener('click', renderCreate);
      Array.prototype.forEach.call(document.querySelectorAll('.event-tile[data-id]'), function (el) {

    async function createEvent() {
      var btn = document.getElementById('create-btn');
      var title = document.getElementById('f-title').value.trim();
      if (!title) { toast('Give your event a name.'); return; }
      var whenVal = document.getElementById('f-when').value;
      var capVal = parseInt(document.getElementById('f-cap').value, 10);
      var emoji = (document.querySelector('.emoji-opt.sel') || {}).getAttribute ? document.querySelector('.emoji-opt.sel').getAttribute('data-e') : '🎉';
      var payload = {
        title: title,
        emoji: emoji,
        description: document.getElementById('f-desc').value,
        location: document.getElementById('f-loc').value,
        timezone: document.getElementById('f-tz').value,
        host_name: document.getElementById('f-host').value,
        cover_theme: selectedTheme(),
        cover_image_url: document.getElementById('f-cover').value.trim(),
        title_font: selectedFont(),
        is_public: document.getElementById('f-public').checked,
        link_url: fnValue('fnf-link', 'f-link'),
        playlist_url: fnValue('fnf-playlist', 'f-playlist'),
        registry_url: fnValue('fnf-registry', 'f-registry'),
        dress_code: fnValue('fnf-dress', 'f-dress'),
        cost_text: fnValue('fnf-cost', 'f-cost'),
        host_nickname: fnValue('fnf-nick', 'f-nick'),
      };
      // datetime-local is wall-clock in the browser's tz; convert to ISO.
      if (whenVal) payload.starts_at = new Date(whenVal).toISOString();
      var deadlineVal = fnValue('fnf-deadline', 'f-deadline');
      if (deadlineVal) payload.rsvp_deadline = new Date(deadlineVal).toISOString();
      if (capVal > 0) payload.capacity = capVal;
      if (dateOpts.length) payload.date_options = dateOpts.slice();
      btn.disabled = true; btn.textContent = 'Creating…';
      var res, data;
      try { res = await authFetch('/parties/api/events', { method: 'POST', body: JSON.stringify(payload) }); data = await res.json(); }
      catch (e) { toast('Network error — try again.'); btn.disabled = false; btn.textContent = 'Create event'; return; }
      if (!data.ok) { toast(data.error || 'Could not create the event.'); btn.disabled = false; btn.textContent = 'Create event'; return; }
      var uploadFile = (document.getElementById('f-upload').files || [])[0];
      if (uploadFile) {
        btn.textContent = 'Uploading photo…';
        try { await uploadCover(data.event.id, uploadFile); }
        catch (e) { toast('Event created, but the photo upload failed — try again from settings.'); }
      }
      openDetail(data.event.id);
    }

      if (!data.ok) { renderMsg(data.error || 'Could not load that event.'); return; }
      state.detail = data;
      renderDetail();

          '<div class="field" style="margin-top:16px"><label>Or blast a custom update to everyone (except decliners)</label>' +
            '<input type="text" id="blast-input" maxlength="300" placeholder="Change of plans — we start at 8pm now!"></div>' +
          '<button class="btn btn-ghost btn-sm" id="blast-btn">Send update</button>' +
          '<div class="progress" id="send-progress"></div>' +
        '</div>' +

        '<div class="glass sec-card">' +
          '<h3>Guest list (' + guests.length + ')</h3>' +
          (guests.length
            ? '<div class="table-scroll"><table class="guest-table"><thead><tr><th>Guest</th><th>RSVP</th><th>Note</th><th>Invite</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
            : '<p class="muted">No guests yet — paste some above.</p>') +
        '</div>' +

        (ev.allow_comments ? '<div class="glass sec-card">' +
          '<h3>The wall (' + comments.length + ')</h3>' +
          (commentRows || '<p class="muted" style="margin:0">No guest messages yet.</p>') +
        '</div>' : '');

      document.getElementById('back').addEventListener('click', function () { loadEvents(); });
      document.getElementById('copy-share').addEventListener('click', function () {
        navigator.clipboard.writeText(ev.share_link).then(function () { toast('Open invite link copied — anyone with it can RSVP.'); });
      });
      document.getElementById('settings-toggle').addEventListener('click', function () {
        var card = document.getElementById('settings-card');
        card.style.display = card.style.display === 'none' ? '' : 'none';
        bindThemeRow();
      });
      bindFontRow(null);
      bindCoverGrid(document.getElementById('s-cover'));
      document.getElementById('s-upload-btn').addEventListener('click', function () { document.getElementById('s-upload').click(); });
      document.getElementById('s-upload').addEventListener('change', async function () {
        var f = this.files[0];
        if (!f) return;
        var btn = document.getElementById('s-upload-btn');
        btn.textContent = '⏳ Uploading…'; btn.disabled = true;
        try {
          var url = await uploadCover(ev.id, f);
          document.getElementById('s-cover').value = url;
          toast('Photo uploaded — it\'s your cover now.');
          openDetail(ev.id);
        } catch (e) {
          toast(String(e.message || 'Upload failed — try a smaller image.'));
          btn.textContent = '📷 Upload a photo'; btn.disabled = false;
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function (el) {
        el.addEventListener('click', function () { pickPollDate(ev.id, el.getAttribute('data-pick')); });
      });
      document.getElementById('save-settings').addEventListener('click', function () { saveSettings(ev.id); });
      document.getElementById('add-cohost').addEventListener('click', function () { addCohost(ev.id); });
      var cancelBtn = document.getElementById('cancel-ev');
      if (cancelBtn) cancelBtn.addEventListener('click', function () { cancelEvent(ev.id); });
      document.getElementById('add-guests-btn').addEventListener('click', function () { addGuests(ev.id); });
      document.getElementById('send-invites-btn').addEventListener('click', function () { sendBatched(ev.id, 'invite', null); });
      document.getElementById('send-reminder-btn').addEventListener('click', function () { sendReminder(ev.id); });
      document.getElementById('blast-btn').addEventListener('click', function () { sendBlast(ev.id); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-gid]'), function (el) {
        el.addEventListener('click', function () { removeGuest(ev.id, el.getAttribute('data-gid')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (el) {
        el.addEventListener('click', function () {
          navigator.clipboard.writeText(el.getAttribute('data-copy')).then(function () { toast('Personal RSVP link copied.'); });
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-admit]'), function (el) {
        el.addEventListener('click', function () { admitGuest(ev.id, el.getAttribute('data-admit')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-cid]'), function (el) {
        el.addEventListener('click', function () { deleteComment(ev.id, el.getAttribute('data-cid')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-cohost]'), function (el) {
        el.addEventListener('click', function () { removeCohost(ev.id, el.getAttribute('data-cohost')); });
      });
    }

    async function saveSettings(id) {
      var capVal = parseInt(document.getElementById('s-cap').value, 10);
      var deadlineVal = document.getElementById('s-deadline').value;
      var payload = {
        title: document.getElementById('s-title').value,
        location: document.getElementById('s-loc').value,
        description: document.getElementById('s-desc').value,
        capacity: capVal > 0 ? capVal : null,
        cover_theme: selectedTheme(),
        cover_image_url: document.getElementById('s-cover').value.trim(),
        show_guest_list: document.getElementById('s-guestlist').checked,
        allow_comments: document.getElementById('s-comments').checked,
        auto_reminder: document.getElementById('s-autorem').checked,
        notify_on_rsvp: document.getElementById('s-notify').checked,
        title_font: selectedFont(),
        is_public: document.getElementById('s-public').checked,
        link_url: document.getElementById('s-link').value.trim(),
        playlist_url: document.getElementById('s-playlist').value.trim(),
        registry_url: document.getElementById('s-registry').value.trim(),
        dress_code: document.getElementById('s-dress').value.trim(),
        cost_text: document.getElementById('s-cost').value.trim(),
        host_nickname: document.getElementById('s-nick').value.trim(),
        rsvp_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      };
      try {
        var res = await authFetch('/parties/api/events/' + id, { method: 'PATCH', body: JSON.stringify(payload) });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not save.'); return; }
        toast('Settings saved.');
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function pickPollDate(id, optionId) {
      if (!confirm('Lock this date in as the event time? The poll closes and guests see the final date.')) return;
      try {
        var res = await authFetch('/parties/api/events/' + id + '/date-options/' + optionId + '/pick', { method: 'POST' });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not set the date.'); return; }
        toast('Date locked in! 🎉');
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function addCohost(id) {
      var email = document.getElementById('cohost-email').value.trim();
      if (!email) { toast('Enter the co-host\'s email.'); return; }
      try {
        var res = await authFetch('/parties/api/events/' + id + '/cohosts', { method: 'POST', body: JSON.stringify({ email: email }) });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not add co-host.'); return; }
        toast('Co-host added — they\'ll see this event when they sign in with that email.');
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function removeCohost(id, email) {
      try {
        var res = await authFetch('/parties/api/events/' + id + '/cohosts', { method: 'DELETE', body: JSON.stringify({ email: email }) });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not remove co-host.'); return; }
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function admitGuest(id, gid) {
      try {
        var res = await authFetch('/parties/api/events/' + id + '/guests/' + gid + '/admit', { method: 'POST', body: JSON.stringify({}) });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not admit.'); return; }
        toast(data.notified ? 'Admitted — they just got the good-news text.' : 'Admitted (could not notify them automatically).');
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function deleteComment(id, cid) {
      try {
        var res = await authFetch('/parties/api/events/' + id + '/comments/' + cid, { method: 'DELETE' });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not delete.'); return; }
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    async function cancelEvent(id) {
      if (!confirm('Cancel this event? Guests who visit their link will see it\'s cancelled.')) return;
      try {
        var res = await authFetch('/parties/api/events/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not cancel.'); return; }
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    // Client-side guest-line parsing mirrors the server's parseGuestLine; the
    // server re-validates everything, this is just for a fast preview.
    function parseLines(text) {
      return text.split('\n').map(function (line) {
        var raw = line.trim();
        if (!raw) return null;
        var angled = raw.match(/^(.*?)<([^>]+)>\s*$/);
        if (angled) return { name: angled[1].trim().replace(/,\s*$/, ''), email: angled[2].trim() };
        var parts = raw.split(/[,;\t]/).map(function (p) { return p.trim(); }).filter(Boolean);
        var g = {};
        var leftover = [];
        parts.forEach(function (p) {
          if (!g.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p)) { g.email = p; return; }
          var digits = p.replace(/[^0-9]/g, '');
          if (!g.phone && (digits.length === 10 || (digits.length === 11 && digits[0] === '1') || (p.trim()[0] === '+' && digits.length >= 8))) { g.phone = p; return; }
          leftover.push(p);
        });
        if (leftover.length) g.name = leftover.join(' ');
        if (!g.name && !g.phone && !g.email) return null;
        return g;
      }).filter(Boolean);
    }

    async function addGuests(id) {
      var input = document.getElementById('guest-input');
      var guests = parseLines(input.value);
      if (!guests.length) { toast('Paste at least one line with a phone number or email.'); return; }
      var btn = document.getElementById('add-guests-btn');
      btn.disabled = true; btn.textContent = 'Adding…';
      var res, data;
      try { res = await authFetch('/parties/api/events/' + id + '/guests', { method: 'POST', body: JSON.stringify({ guests: guests }) }); data = await res.json(); }
      catch (e) { toast('Network error — try again.'); btn.disabled = false; btn.textContent = 'Add to guest list'; return; }
      if (!data.ok) { toast(data.error || 'Could not add guests.'); btn.disabled = false; btn.textContent = 'Add to guest list'; return; }
      var msg = 'Added ' + data.added.length + ' guest' + (data.added.length === 1 ? '' : 's');
      if (data.skipped.length) msg += ' · skipped ' + data.skipped.length + ' (' + data.skipped.map(function (s) { return s.reason; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('; ') + ')';
      toast(msg);
      openDetail(id);
    }

    async function removeGuest(id, gid) {
      try {
        var res = await authFetch('/parties/api/events/' + id + '/guests/' + gid, { method: 'DELETE' });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not remove.'); return; }
        openDetail(id);
      } catch (e) { toast('Network error — try again.'); }
    }

    // The server caps each call at 25 sends, so chunk explicit guest IDs and
    // walk through them with a progress line.
    async function sendBatched(id, kind, message) {
      if (state.sending) return;
      var guests = state.detail.guests;
      var targets = guests.filter(function (g) {
        if (!g.phone_e164 && !g.email) return false;
        if (g.rsvp === 'waitlist') return false;
        if (kind === 'invite') return !g.invited_at;
        return g.rsvp === 'pending' || g.rsvp === 'yes' || g.rsvp === 'maybe';
      }).map(function (g) { return g.id; });
      if (!targets.length) { toast('Nobody to send that to right now.'); return; }

      state.sending = true;
      var prog = document.getElementById('send-progress');
      var total = 0, failed = 0;
      try {
        for (var i = 0; i < targets.length; i += 25) {
          prog.textContent = 'Sending… ' + total + ' of ' + targets.length;
          var body = { kind: kind, guestIds: targets.slice(i, i + 25) };
          if (message) body.message = message;
          var res = await authFetch('/parties/api/events/' + id + '/send', { method: 'POST', body: JSON.stringify(body) });
          var data = await res.json();
          if (!data.ok) { toast(data.error || 'Send failed.'); break; }
          total += data.sent.length;
          failed += data.sent.filter(function (s) { return !s.ok; }).length;
        }
        prog.textContent = total
          ? ('Done — ' + (total - failed) + ' of ' + targets.length + ' sent 🎉' + (failed ? ' (' + failed + ' failed)' : ''))
          : 'Nothing was sent.';
        if (failed) toast(failed + ' message(s) failed — the send column shows who got theirs.');
      } catch (e) {
        toast('Network error mid-send — some messages may have gone out. Reload to check.');
      }
      state.sending = false;
      setTimeout(function () { openDetail(id); }, 1400);
    }

    function sendReminder(id) { sendBatched(id, 'reminder', null); }

    function sendBlast(id) {
      var msg = document.getElementById('blast-input').value.trim();
      if (!msg) { toast('Write the update first.'); return; }
      sendBatched(id, 'update', msg);
    }

    boot();
  </script>
