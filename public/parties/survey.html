<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick questions</title>
  <meta name="description" content="A few quick questions from your host — no account needed." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/parties/parties.css" />
  <style>
    .sv-main { max-width: 560px; margin: 0 auto; padding: 5vh 20px 10vh; }
    .sv-card { padding: 30px clamp(22px, 5vw, 40px); }
    .sv-emoji { font-size: 48px; line-height: 1; text-align: center; margin-bottom: 8px; }
    .sv-event { text-align: center; font-size: 14px; color: var(--muted); margin: 0 0 4px; }
    .sv-title { text-align: center; margin: 0 0 24px; }
    .q { margin-bottom: 24px; }
    .q .prompt { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .q .req { color: var(--accent); margin-left: 4px; }
    .opt {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.04);
      cursor: pointer; font-size: 15px; transition: border-color .12s ease;
    }
    .opt:hover { border-color: var(--accent); }
    .opt input { width: auto; accent-color: var(--accent); }
    .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .privacy { font-size: 13px; color: var(--muted); margin-top: 20px; text-align: center; }
    .done-emoji { font-size: 56px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="fluid-bg"></div>
  <main class="sv-main" id="root">
    <div class="center-wrap"><p class="muted">Loading…</p></div>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';
    var root = document.getElementById('root');
    var token = (location.pathname.match(/^\/s\/([A-Za-z0-9]+)/) || [])[1] || '';
    var guestToken = new URLSearchParams(location.search).get('g') || '';
    var state = { survey: null, event: null, questions: [], guest: null, prior: null };

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2600);
    }
    function renderError(msg) {
      root.innerHTML = '<div class="center-wrap"><div class="glass msg-card">' +
        '<div class="done-emoji">😕</div><p class="muted">' + esc(msg) + '</p></div></div>';
    }

    function qHtml(q, i) {
      var prior = state.prior ? state.prior[q.id] : undefined;
      var head = '<div class="prompt">' + esc(q.prompt) + (q.required ? '<span class="req">*</span>' : '') + '</div>';
      if (q.kind === 'text') {
        return '<div class="q" data-qid="' + esc(q.id) + '" data-kind="text">' + head +
          '<textarea maxlength="1000" rows="3" placeholder="Type your answer…">' + esc(prior || '') + '</textarea></div>';
      }
      var multi = q.kind === 'multi';
      var opts = q.options.map(function (o, j) {
        var checked = multi ? (Array.isArray(prior) && prior.indexOf(o) !== -1) : prior === o;
        return '<label class="opt' + (checked ? ' sel' : '') + '"><input type="' + (multi ? 'checkbox' : 'radio') +
          '" name="q' + i + '" value="' + esc(o) + '"' + (checked ? ' checked' : '') + '>' + esc(o) + '</label>';
      }).join('');
      return '<div class="q" data-qid="' + esc(q.id) + '" data-kind="' + q.kind + '">' + head + opts +
        (multi ? '<div class="hint" style="font-size:12px;color:var(--muted)">Pick all that apply</div>' : '') + '</div>';
    }

    function render() {
      var ev = state.event;
      var needName = !state.guest || !state.guest.name;
      root.innerHTML =
        '<div class="glass sv-card">' +
          '<div class="sv-emoji">' + esc(ev.emoji || '🎉') + '</div>' +
          '<p class="sv-event">' + esc(ev.host_name || 'Your host') + ' · ' + esc(ev.title) + '</p>' +
          '<h1 class="sv-title" style="font-size:26px">' + esc(state.survey.title) + '</h1>' +
          (state.prior ? '<p class="muted" style="text-align:center;font-size:14px">You already answered — feel free to update.</p>' : '') +
          state.questions.map(qHtml).join('') +
          (needName ? '<div class="field"><label>Your name</label><input type="text" id="f-name" maxlength="80" placeholder="So the host knows it\'s you"></div>' : '') +
          '<div style="text-align:center;margin-top:22px"><button class="btn" id="submit-btn">' + (state.prior ? 'Update answers' : 'Send answers') + '</button></div>' +
          '<p class="privacy">No account needed. Answers go only to the host of this event.</p>' +
        '</div>';

      Array.prototype.forEach.call(document.querySelectorAll('.opt input'), function (inp) {
        inp.addEventListener('change', function () {
          var group = inp.closest('.q');
          if (inp.type === 'radio') {
            Array.prototype.forEach.call(group.querySelectorAll('.opt'), function (o) { o.classList.remove('sel'); });
          }
          inp.closest('.opt').classList.toggle('sel', inp.checked);
        });
      });
      document.getElementById('submit-btn').addEventListener('click', submit);
    }

    function collect() {
      var answers = {};
      var qs = document.querySelectorAll('.q');
      for (var i = 0; i < qs.length; i++) {
        var el = qs[i], qid = el.getAttribute('data-qid'), kind = el.getAttribute('data-kind');
        if (kind === 'text') {
          var v = el.querySelector('textarea').value.trim();
          if (v) answers[qid] = v;
        } else if (kind === 'choice') {
          var r = el.querySelector('input:checked');
          if (r) answers[qid] = r.value;
        } else {
          var vals = [];
          Array.prototype.forEach.call(el.querySelectorAll('input:checked'), function (c) { vals.push(c.value); });
          if (vals.length) answers[qid] = vals;
        }
      }
      return answers;
    }

    async function submit() {
      var btn = document.getElementById('submit-btn');
      var answers = collect();
      // Client-side required check for a friendlier error than the server's.
      for (var i = 0; i < state.questions.length; i++) {
        var q = state.questions[i];
        if (q.required && answers[q.id] === undefined) { toast('"' + q.prompt + '" needs an answer.'); return; }
      }
      if (!Object.keys(answers).length) { toast('Answer at least one question.'); return; }
      var payload = { answers: answers };
      var nameEl = document.getElementById('f-name');
      if (nameEl) {
        payload.name = nameEl.value.trim();
        if (!payload.name) { toast('Please add your name so the host knows who answered.'); return; }
      }
      btn.disabled = true; btn.textContent = 'Sending…';
      var res, data;
      try {
        res = await fetch('/parties/api/survey/' + token + (guestToken ? '?g=' + encodeURIComponent(guestToken) : ''), {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
        });
        data = await res.json();
      } catch (e) {
        toast('Network hiccup — please try again.');
        btn.disabled = false; btn.textContent = 'Send answers';
        return;
      }
      if (!res.ok || !data.ok) {
        toast(data && data.error ? data.error : 'Something went wrong — please try again.');
        btn.disabled = false; btn.textContent = 'Send answers';
        return;
      }
      root.innerHTML = '<div class="glass sv-card" style="text-align:center">' +
        '<div class="done-emoji">🙌</div><h2>Thanks!</h2>' +
        '<p class="muted">Your answers are in. You can come back to this link to change them anytime.</p></div>';
    }

    async function load() {
      if (!token) { renderError('This survey link looks incomplete.'); return; }
      var res, data;
      try {
        res = await fetch('/parties/api/survey/' + token + (guestToken ? '?g=' + encodeURIComponent(guestToken) : ''));
        data = await res.json();
      } catch (e) { renderError('Network hiccup — please refresh to try again.'); return; }
      if (!res.ok || !data.ok) { renderError("We couldn't find this survey. Double-check the link."); return; }
      state.survey = data.survey;
      state.event = data.event;
      state.questions = data.questions;
      state.guest = data.guest;
      state.prior = data.prior;
      if (state.survey.status !== 'active') { renderError('This survey is closed — thanks anyway!'); return; }
      document.title = state.survey.title + ' — ' + state.event.title;
      document.body.className = 'theme-' + (state.event.cover_theme || 'confetti');
      render();
    }

    load();
  </script>
</body>
</html>
