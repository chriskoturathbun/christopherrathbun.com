<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're invited</title>
  <meta name="description" content="RSVP in one tap — no account, no questions." />
  <meta name="robots" content="noindex" />
  <!--OG-->
  <link rel="icon" type="image/svg+xml" href="/landing/mark.svg" />
  <link rel="stylesheet" href="/parties/parties.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:ital,wght@0,600;1,600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    .rsvp-main { max-width: 560px; margin: 0 auto; padding: 5vh 20px 10vh; }
    .event-card { padding: 30px clamp(22px, 5vw, 40px); text-align: center; }
    .event-emoji { font-size: 64px; line-height: 1; margin-bottom: 10px; }
    .event-host { font-size: 15px; color: var(--muted); margin: 0 0 4px; }
    .event-title { margin: 0 0 18px; }
    .detail-row { display: flex; gap: 10px; align-items: baseline; justify-content: center; font-size: 16px; margin: 6px 0; flex-wrap: wrap; }
    .detail-row .k { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    .event-desc { white-space: pre-wrap; text-align: left; margin: 20px 0 0; color: var(--text); font-size: 15px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .rsvp-btns { display: flex; gap: 12px; justify-content: center; margin: 26px 0 8px; flex-wrap: wrap; }
    .rsvp-btn {
      flex: 1 1 130px; max-width: 160px; padding: 16px 10px; border-radius: 16px; cursor: pointer;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
      font-family: var(--font); font-size: 15px; font-weight: 600; transition: border-color .15s ease, transform .12s ease;
    }
    .rsvp-btn .big { display: block; font-size: 26px; margin-bottom: 6px; }
    .rsvp-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
    .rsvp-btn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .extra { text-align: left; margin-top: 18px; }
    .stepper { display: flex; align-items: center; gap: 14px; }
    .stepper button {
      width: 38px; height: 38px; border-radius: 999px; font-size: 20px; cursor: pointer;
      background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--text);
    }
    .stepper .num { font-size: 18px; font-weight: 700; min-width: 24px; text-align: center; }
    .privacy { font-size: 13px; color: var(--muted); margin-top: 22px; }
    .done-emoji { font-size: 56px; margin-bottom: 12px; }
    .done-inline { padding: 26px; text-align: center; margin-bottom: 18px; }

    .side-card { padding: 22px clamp(18px, 4vw, 28px); margin-top: 18px; text-align: left; }
    .side-card h3 { margin: 0 0 12px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .going-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .going-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); font-size: 14px;
    }
    .going-chip .av {
      width: 22px; height: 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #140a1c; font-size: 12px; font-weight: 700;
    }
    .maybe-line { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .going-chip.blurred { filter: blur(5px); user-select: none; pointer-events: none; }
    .lock-note { margin-top: 12px; font-size: 13px; color: var(--muted); }
    .comment { padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 14px; }
    .comment:first-of-type { border-top: none; }
    .comment .who { font-weight: 700; margin-right: 8px; }
    .comment .when { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .composer { display: flex; gap: 10px; margin-top: 14px; }
    .composer input { flex: 1; }

    /* Title styles the host picked */
    .tf-classic { font-family: var(--font); }
    .tf-eclectic { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.02em; }
    .tf-fancy { font-family: 'Dancing Script', cursive; font-weight: 600; font-size: 44px; }
    .tf-literary { font-family: 'Fraunces', Georgia, serif; font-style: italic; }

    /* Link / playlist / registry buttons */
    .links-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .link-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding: 9px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); text-decoration: none; }
    .link-btn:hover { border-color: var(--accent); }

    /* Date poll voting */
    .poll-opt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 14px; flex-wrap: wrap; }
    .poll-opt:first-of-type { border-top: none; }
    .poll-opt input { width: auto; }
    .poll-bar { height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.7; min-width: 4px; }
    .closed-note { margin: 22px 0 4px; padding: 14px 18px; border-radius: 14px; font-size: 15px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>
  <div class="fluid-bg"></div>
  <main class="rsvp-main" id="root">
    <div class="center-wrap"><p class="muted">Loading your invite…</p></div>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';
    var root = document.getElementById('root');
    var token = (location.pathname.match(/^\/e\/([A-Za-z0-9]+)/) || [])[1] || '';
    var state = { type: null, event: null, guest: null, rsvp: null, plusOnes: 0, atCapacity: false,
                  going: [], maybe: [], comments: [], done: null, myToken: null, datePoll: null };

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2600);
    }
    function localWhen(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      try {
        return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch (e) { return ''; }
    }
    // The token a guest comments with: their personal link token, or the one
    // handed back after RSVPing through the open share link (kept locally).
    function commentToken() {
      if (state.type === 'guest') return token;
      if (state.myToken) return state.myToken;
      try { return localStorage.getItem('party_guest_' + token) || null; } catch (e) { return null; }
    }
    function rememberToken(t) {
      state.myToken = t;
      try { localStorage.setItem('party_guest_' + token, t); } catch (e) {}
    }

    function renderError(msg) {
      root.innerHTML = '<div class="center-wrap"><div class="glass msg-card">' +
        '<div class="event-emoji">😕</div><p class="muted">' + esc(msg) + '</p></div></div>';
    }

    function render() {
      var ev = state.event;
      var isGuest = state.type === 'guest';
      var g = state.guest || {};
      var sel = state.rsvp || (isGuest && g.rsvp !== 'pending' ? g.rsvp : null);
      var mapsHref = ev.location ? 'https://maps.google.com/?q=' + encodeURIComponent(ev.location) : null;
      var local = localWhen(ev.starts_at);

      var doneBanner = '';
      if (state.done) {
        var msgs = {
          yes: { e: '🎉', t: "You're in!", s: 'The host can see your RSVP. See you there!' },
          maybe: { e: '🤔', t: 'Marked as maybe', s: 'Come back to this link anytime to update your answer.' },
          no: { e: '💜', t: 'Thanks for letting them know', s: 'Changed your mind? This link always works.' },
          waitlist: { e: '⏳', t: "You're on the waitlist", s: "The event is at capacity — if a spot opens, the host can admit you and you'll get a text." },
        };
        var mm = msgs[state.done] || msgs.yes;
        doneBanner = '<div class="glass done-inline"><div class="done-emoji">' + mm.e + '</div>' +
          '<h2>' + esc(mm.t) + '</h2><p class="muted" style="margin:6px 0 0">' + esc(mm.s) + '</p></div>';
      }

      var closed = !!ev.rsvp_closed;
      var hostLine = ev.host_nickname
        ? 'Hosted by ' + esc(ev.host_nickname)
        : esc(ev.host_name || 'Someone') + ' invited you to';
      var linksRow = [
        ev.link_url ? '<a class="link-btn" href="' + esc(ev.link_url) + '" target="_blank" rel="noopener noreferrer">🔗 Link</a>' : '',
        ev.playlist_url ? '<a class="link-btn" href="' + esc(ev.playlist_url) + '" target="_blank" rel="noopener noreferrer">🎵 Playlist</a>' : '',
        ev.registry_url ? '<a class="link-btn" href="' + esc(ev.registry_url) + '" target="_blank" rel="noopener noreferrer">🎁 Registry</a>' : '',
      ].filter(Boolean).join('');

      var html = doneBanner +
        '<div class="glass event-card">' +
          (ev.cover_image_url ? '<img class="cover-img" src="' + esc(ev.cover_image_url) + '" alt="">' : '') +
          '<div class="event-emoji">' + esc(ev.emoji || '🎉') + '</div>' +
          '<p class="event-host">' + hostLine + '</p>' +
          '<h1 class="event-title tf-' + esc(ev.title_font || 'classic') + '">' + esc(ev.title) + '</h1>' +
          (ev.when_text ? '<div class="detail-row"><span class="k">When</span><span>' + esc(ev.when_text) +
            (local && local !== ev.when_text ? ' <span class="muted">(' + esc(local) + ' your time)</span>' : '') + '</span></div>' : '') +
          (ev.location ? '<div class="detail-row"><span class="k">Where</span><span><a style="color:var(--accent)" href="' + esc(mapsHref) + '" target="_blank" rel="noopener">' + esc(ev.location) + '</a></span></div>' : '') +
          (ev.cost_text ? '<div class="detail-row"><span class="k">Cost</span><span>' + esc(ev.cost_text) + '</span></div>' : '') +
          (ev.dress_code ? '<div class="detail-row"><span class="k">Dress</span><span>' + esc(ev.dress_code) + '</span></div>' : '') +
          (ev.rsvp_deadline && !closed ? '<div class="detail-row"><span class="k">RSVP by</span><span>' + esc(localWhen(ev.rsvp_deadline) || '') + '</span></div>' : '') +
          (linksRow ? '<div class="links-row">' + linksRow + '</div>' : '') +
          (ev.description ? '<div class="event-desc">' + esc(ev.description) + '</div>' : '') +
          (closed ? '<div class="closed-note">⏳ RSVPs are closed for this event' +
            (isGuest && g.rsvp !== 'pending' ? ' — you\'re marked as <strong>' + esc(g.rsvp) + '</strong>.' : '.') + '</div>' : '') +
          (state.done || closed ? '' :
            '<div class="rsvp-btns">' +
              btn('yes', '🎉', "I'm in", sel) + btn('maybe', '🤔', 'Maybe', sel) + btn('no', '😢', "Can't make it", sel) +
            '</div>' +
            '<div class="extra" id="extra"></div>') +
          (state.done ? '<div style="margin-top:14px"><button class="btn btn-ghost btn-sm" id="change-btn">Change my RSVP</button></div>' : '') +
          '<p class="privacy">No account needed. Your info is only used for this event — nothing else, ever.</p>' +
          '<p class="privacy" style="margin-top:6px">Hosting this party? ' +
            '<a style="color:var(--accent)" href="https://christopherrathbun.com/parties?e=' + esc(ev.id || '') + '">Sign in to manage it</a>.</p>' +
        '</div>' +
        datePollHtml() +
        guestListHtml() +
        commentsHtml();
      root.innerHTML = html;

      if (state.done) {
        document.getElementById('change-btn').addEventListener('click', function () { state.done = null; state.rsvp = null; render(); });
      } else if (!closed) {
        ['yes', 'maybe', 'no'].forEach(function (v) {
          document.getElementById('rsvp-' + v).addEventListener('click', function () {
            state.rsvp = v; render(); renderExtra();
          });
        });
        renderExtra();
      }
      bindDatePoll();
      bindSocial();
    }

    /* ---- Date poll (host is polling for the best date) ---- */
    function datePollHtml() {
      var poll = state.datePoll;
      if (!poll || !poll.length) return '';
      var canVote = !!commentToken();
      var max = Math.max.apply(null, [1].concat(poll.map(function (o) { return o.votes; })));
      var rows = poll.map(function (o) {
        return '<div class="poll-opt">' +
          (canVote ? '<input type="checkbox" data-poll-opt="' + esc(o.id) + '"' + (o.mine ? ' checked' : '') + '>' : '') +
          '<span style="min-width:180px">' + esc(o.when_text) + '</span>' +
          '<span class="poll-bar" style="width:' + Math.round((o.votes / max) * 120) + 'px"></span>' +
          '<span class="muted">' + o.votes + '</span>' +
          '</div>';
      }).join('');
      return '<div class="glass side-card"><h3>📊 When works for you?</h3>' +
        '<p class="muted" style="font-size:13px;margin:0 0 6px">The host is picking a date — vote for every time that works.</p>' +
        rows +
        (canVote
          ? '<button class="btn btn-sm" id="poll-save" style="margin-top:12px">Save my votes</button>'
          : '<p class="muted" style="font-size:13px;margin:12px 0 0">RSVP first, then vote on dates.</p>') +
        '</div>';
    }
    function bindDatePoll() {
      var saveBtn = document.getElementById('poll-save');
      if (!saveBtn) return;
      saveBtn.addEventListener('click', async function () {
        var ids = Array.prototype.map.call(document.querySelectorAll('[data-poll-opt]:checked'), function (el) {
          return el.getAttribute('data-poll-opt');
        });
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        try {
          var res = await fetch('/parties/api/datevote/' + commentToken(), {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ option_ids: ids }),
          });
          var data = await res.json();
          if (!data.ok) { toast(data.error || 'Could not save votes.'); }
          else { state.datePoll = data.date_poll; toast('Votes saved — thanks!'); render(); }
        } catch (e) { toast('Network hiccup — try again.'); }
        saveBtn.disabled = false; saveBtn.textContent = 'Save my votes';
      });
    }

    function btn(val, big, label, sel) {
      return '<button class="rsvp-btn' + (sel === val ? ' sel' : '') + '" id="rsvp-' + val + '">' +
        '<span class="big">' + big + '</span>' + label + '</button>';
    }

    function guestListHtml() {
      if (!state.event.show_guest_list) return '';
      // Blurred until the viewer RSVPs — the server only sends counts, so the
      // chips here are decoys; real names never reach the page.
      if (state.locked) {
        if (!state.goingCount && !state.maybeCount) return '';
        var fakes = ['Someone Fun', 'A Friend', 'Mystery Guest', 'Good Company', 'Plus One', 'The Life of It'];
        var blurChips = '';
        for (var i = 0; i < Math.min(state.goingCount, 12); i++) {
          var nm = fakes[i % fakes.length];
          blurChips += '<span class="going-chip blurred" aria-hidden="true"><span class="av">' + nm[0] + '</span>' + nm + '</span>';
        }
        return '<div class="glass side-card">' +
          '<h3>Who\'s going · ' + state.goingCount + '</h3>' +
          '<div class="going-row">' + blurChips + '</div>' +
          '<div class="lock-note">🔒 RSVP to see who\'s coming' +
          (state.maybeCount ? ' — plus ' + state.maybeCount + ' maybe' + (state.maybeCount === 1 ? '' : 's') : '') + '.</div>' +
          '</div>';
      }
      if (!state.going.length && !state.maybe.length) return '';
      var chips = state.going.map(function (p) {
        var initial = (p.name || 'G')[0].toUpperCase();
        return '<span class="going-chip"><span class="av">' + esc(initial) + '</span>' + esc(p.name) +
          (p.plus_ones ? ' +' + p.plus_ones : '') + '</span>';
      }).join('');
      var totalPlus = state.going.reduce(function (a, p) { return a + (p.plus_ones || 0); }, 0);
      return '<div class="glass side-card">' +
        '<h3>Who\'s going · ' + (state.going.length + totalPlus) + '</h3>' +
        (chips ? '<div class="going-row">' + chips + '</div>' : '<p class="muted" style="margin:0;font-size:14px">Be the first to say yes!</p>') +
        (state.maybe.length ? '<div class="maybe-line">' + state.maybe.length + ' maybe' + (state.maybe.length === 1 ? '' : 's') +
          ': ' + esc(state.maybe.map(function (p) { return p.name; }).join(', ')) + '</div>' : '') +
        '</div>';
    }

    function commentsHtml() {
      if (!state.event.allow_comments) return '';
      var list = state.comments.map(function (c) {
        var ts = c.created_at ? String(c.created_at).replace(' ', 'T') + 'Z' : '';
        return '<div class="comment"><span class="who">' + esc(c.name || 'Guest') + '</span>' + esc(c.body) +
          '<span class="when">' + esc(localWhen(ts) || '') + '</span></div>';
      }).join('');
      var canPost = !!commentToken();
      return '<div class="glass side-card">' +
        '<h3>The wall</h3>' +
        (list || '<p class="muted" style="margin:0;font-size:14px">No messages yet.</p>') +
        (canPost
          ? '<div class="composer"><input type="text" id="c-input" maxlength="500" placeholder="Say something…">' +
            '<button class="btn btn-sm" id="c-post">Post</button></div>'
          : '<p class="muted" style="font-size:13px;margin:12px 0 0">RSVP to join the conversation.</p>') +
        '</div>';
    }

    function bindSocial() {
      var post = document.getElementById('c-post');
      if (post) post.addEventListener('click', postComment);
      var inp = document.getElementById('c-input');
      if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') postComment(); });
    }

    async function postComment() {
      var inp = document.getElementById('c-input');
      var text = inp.value.trim();
      if (!text) return;
      var t = commentToken();
      if (!t) { toast('RSVP first to join the conversation.'); return; }
      try {
        var res = await fetch('/parties/api/comment/' + t, {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ body: text }),
        });
        var data = await res.json();
        if (!data.ok) { toast(data.error || 'Could not post.'); return; }
        state.comments = data.comments;
        render();
      } catch (e) { toast('Network hiccup — try again.'); }
    }

    function renderExtra() {
      var box = document.getElementById('extra');
      if (!box || !state.rsvp) { if (box) box.innerHTML = ''; return; }
      var isGuest = state.type === 'guest';
      var g = state.guest || {};
      var joiningWaitlist = state.rsvp === 'yes' && state.atCapacity && !isGuest;
      var html = '';
      if (joiningWaitlist) {
        html += '<p class="muted" style="text-align:center">This event is at capacity — you\'ll join the <strong>waitlist</strong> and get a text if a spot opens.</p>';
      }
      if (!isGuest || !g.name) {
        html += '<div class="field"><label>Your name</label><input type="text" id="f-name" maxlength="80" placeholder="So the host knows it\'s you" value="' + esc(g.name || '') + '"></div>';
      }
      if (!isGuest) {
        html += '<div class="field"><label>Phone (for event updates by text)</label><input type="tel" id="f-phone" placeholder="(555) 555-0123"></div>';
        html += '<div class="field"><label>Email (updates by email instead)</label><input type="email" id="f-email" maxlength="120" placeholder="you@example.com"></div>';
        html += '<p class="muted" style="font-size:13px;margin:2px 0 0">Add at least one so the host can reach you with updates or reminders.</p>';
      }
      if (state.rsvp === 'yes' && !joiningWaitlist) {
        html += '<div class="field"><label>Bringing anyone?</label><div class="stepper">' +
          '<button type="button" id="po-minus">−</button><span class="num" id="po-num">' + state.plusOnes + '</span>' +
          '<button type="button" id="po-plus">+</button><span class="muted" style="font-size:14px">plus-ones</span></div></div>';
      }
      html += '<div class="field"><label>Note to the host (optional)</label><input type="text" id="f-note" maxlength="500" placeholder="Can\'t wait! 🙌" value="' + esc(g.note || '') + '"></div>';
      html += '<div style="text-align:center;margin-top:18px"><button class="btn" id="submit-btn">' +
        (joiningWaitlist ? 'Join waitlist' : 'Send RSVP') + '</button></div>';
      box.innerHTML = html;

      var minus = document.getElementById('po-minus');
      if (minus) {
        minus.addEventListener('click', function () { state.plusOnes = Math.max(0, state.plusOnes - 1); document.getElementById('po-num').textContent = state.plusOnes; });
        document.getElementById('po-plus').addEventListener('click', function () { state.plusOnes = Math.min(10, state.plusOnes + 1); document.getElementById('po-num').textContent = state.plusOnes; });
      }
      document.getElementById('submit-btn').addEventListener('click', submit);
    }

    async function submit() {
      var btnEl = document.getElementById('submit-btn');
      btnEl.disabled = true; btnEl.textContent = 'Sending…';
      var nameEl = document.getElementById('f-name');
      var phoneEl = document.getElementById('f-phone');
      var noteEl = document.getElementById('f-note');
      var payload = {
        rsvp: state.rsvp,
        plus_ones: state.rsvp === 'yes' ? state.plusOnes : 0,
        note: noteEl ? noteEl.value : '',
      };
      if (nameEl) payload.name = nameEl.value;
      var url;
      if (state.type === 'guest') {
        url = '/parties/api/rsvp/' + token;
      } else {
        url = '/parties/api/open/' + token;
        if (phoneEl && phoneEl.value.trim()) payload.phone = phoneEl.value;
        var emailEl = document.getElementById('f-email');
        if (emailEl && emailEl.value.trim()) payload.email = emailEl.value.trim();
        if (!payload.name || !payload.name.trim()) {
          toast('Please add your name so the host knows who this is.');
          btnEl.disabled = false; btnEl.textContent = 'Send RSVP';
          return;
        }
      }
      var res, data;
      try {
        res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
        data = await res.json();
      } catch (e) {
        toast('Network hiccup — please try again.');
        btnEl.disabled = false; btnEl.textContent = 'Send RSVP';
        return;
      }
      if (!res.ok || !data.ok) {
        toast(data && data.error ? data.error : 'Something went wrong — please try again.');
        btnEl.disabled = false; btnEl.textContent = 'Send RSVP';
        return;
      }
      if (data.token) rememberToken(data.token);
      state.done = data.rsvp || state.rsvp;
      // Refresh so the guest list + wall reflect the new RSVP right away.
      load(true);
    }

    async function load(keepDone) {
      if (!token) { renderError('This invite link looks incomplete. Ask your host to resend it.'); return; }
      var res, data;
      try {
        var viewer = commentToken();
        res = await fetch('/parties/api/link/' + token + (viewer && viewer !== token ? '?viewer=' + encodeURIComponent(viewer) : ''));
        data = await res.json();
      } catch (e) { renderError('Network hiccup — please refresh to try again.'); return; }
      if (!res.ok || !data.ok) { renderError("We couldn't find this invite. Double-check the link from your text or email."); return; }
      state.type = data.type;
      state.event = data.event;
      state.guest = data.guest || null;
      state.atCapacity = !!data.at_capacity;
      state.going = data.going || [];
      state.maybe = data.maybe || [];
      state.locked = !!data.guest_list_locked;
      state.goingCount = data.going_count || 0;
      state.maybeCount = data.maybe_count || 0;
      state.comments = data.comments || [];
      state.datePoll = data.date_poll || null;
      state.plusOnes = (data.guest && data.guest.plus_ones) || 0;
      state.rsvp = null;
      if (!keepDone) state.done = null;
      if (state.event.status !== 'active') { renderError('This event has been cancelled.'); return; }
      document.title = (state.event.emoji ? state.event.emoji + ' ' : '') + state.event.title;
      document.body.className = 'theme-' + (state.event.cover_theme || 'confetti');
      render();
    }

    load();
  </script>
</body>
</html>
